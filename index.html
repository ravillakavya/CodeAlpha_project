<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Professional Calculator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="background">

<div class="calculator">

<div class="top">

<h2>

Calculator

</h2>

</div>

<div class="display">

<input
type="text"
id="screen"
placeholder="0"
readonly>

</div>

<div class="buttons">

<button class="operator"
onclick="clearScreen()">

AC

</button>

<button class="operator"
onclick="deleteLast()">

<i class="fa-solid fa-delete-left"></i>

</button>

<button class="operator"
onclick="append('%')">

%

</button>

<button class="operator"
onclick="append('/')">

÷

</button>

<button
onclick="append('7')">

7

</button>

<button
onclick="append('8')">

8

</button>

<button
onclick="append('9')">

9

</button>

<button class="operator"
onclick="append('*')">

×

</button>

<button
onclick="append('4')">

4

</button>

<button
onclick="append('5')">

5

</button>

<button
onclick="append('6')">

6

</button>

<button class="operator"
onclick="append('-')">

−

</button>

<button
onclick="append('1')">

1

</button>

<button
onclick="append('2')">

2

</button>

<button
onclick="append('3')">

3

</button>

<button class="operator"
onclick="append('+')">

+

</button>

<button
onclick="append('0')">

0

</button>

<button
onclick="append('.')">

.

</button>

<button class="equal"
onclick="calculate()">

=

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
